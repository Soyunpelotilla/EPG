name: Generador EPG 3 dias

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scraper_epg.py
      - run: ls -lh epg.xml.gz && cat release_info.txt

      - name: Crear Release EPG 3 dias
        uses: softprops/action-gh-release@v2
        with:
          tag_name: epg-latest
          name: EPG 3 dias
          body_path: release_info.txt
          files: epg.xml.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
