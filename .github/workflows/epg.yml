name: Generador EPG Mexico - epg.guru

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar conversor epg.guru a XMLTV
        run: python scraper_epg.py

      - name: Comprimir a .gz
        run: |
          if [ ! -f guide.xml ]; then
            echo "❌ guide.xml no existe"
            exit 1
          fi
          gzip -c guide.xml > guide.xml.gz
          ls -lh guide.xml guide.xml.gz
          rm guide.xml

      - name: Publicar guide.xml.gz
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add guide.xml.gz
          git commit -m "EPG Mexico actualizada $(date '+%d/%m/%Y %H:%M UTC')" || echo "Sin cambios"
          git push
