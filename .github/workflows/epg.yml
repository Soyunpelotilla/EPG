name: Generador EPG Mexico + USA

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar scraper
        run: python scraper_epg.py

      - name: Ver archivos
        run: ls -lh epg.xml epg.xml.gz

      - name: Publicar epg.xml y epg.xml.gz
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add epg.xml epg.xml.gz
          git commit -m "EPG MX+USA actualizada $(date '+%d/%m/%Y %H:%M UTC')" || echo "Sin cambios"
          git push
