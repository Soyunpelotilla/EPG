name: Generador EPG

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scraper_epg.py
      - run: ls -lh epg.xml.gz

      - name: Subir a Release (se actualiza solo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: epg-latest
          name: EPG 3 dias Mexico + USA
          body: |
            Actualizado automáticamente cada 6 horas
            Contenido: Ayer + Hoy + Mañana
            Mexico + UnitedStates
          files: epg.xml.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
